rules:
  - id: go.security.audit.dangerous-logging-sensitive-data
    message: >-
      Potentially sensitive data flows into a log statement. Avoid logging
      request/response bodies, headers, credentials, tokens, secrets, or raw HTTP
      dumps; log explicit safe fields or redact before logging.
    severity: WARNING
    languages:
      - go
    mode: taint
    metadata:
      category: security
      subcategory:
        - audit
      technology:
        - go
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
        - "A09:2025 - Security Logging & Alerting Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/532.html
        - https://github.com/rancher/rancher/security/advisories/GHSA-xfj7-qf8w-2gcr
        - https://github.com/neuvector/manager/security/advisories/GHSA-fggw-hv56-8m6r
        - https://github.com/neuvector/manager/security/advisories/GHSA-hx45-873x-74qv
    pattern-sources:
      - patterns:
          - pattern: os.Getenv($KEY)
          - metavariable-regex:
              metavariable: $KEY
              regex: '(?i)"[^"]*(pass(word)?|pwd|secret|token|credential|api[_-]?key|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token|session|cookie|authorization|bearer|pat|kubeconfig|aws|gcp|azure)[^"]*"'
      - patterns:
          - pattern-either:
              - pattern: $REQ.Header.Get($KEY)
              - pattern: $REQ.Header[$KEY]
              - pattern: $RESP.Header.Get($KEY)
              - pattern: $RESP.Header[$KEY]
          - metavariable-regex:
              metavariable: $KEY
              regex: '(?i)"(authorization|proxy-authorization|cookie|set-cookie|x-r-sess|x-api-key|x-api-auth-header|x-api-set-cookie-header|x-amz-security-token)"'
      - pattern-either:
          - pattern: $REQ.Header
          - pattern: $REQ.Headers
          - pattern: $RESP.Header
          - pattern: $RESP.Headers
          - pattern: io.ReadAll($REQ.Body)
          - pattern: io.ReadAll($RESP.Body)
          - pattern: ioutil.ReadAll($REQ.Body)
          - pattern: ioutil.ReadAll($RESP.Body)
          - pattern: httputil.DumpRequest($REQ, true)
          - pattern: httputil.DumpRequestOut($REQ, true)
          - pattern: httputil.DumpResponse($RESP, true)
      - patterns:
          - pattern: $OBJ
          - metavariable-regex:
              metavariable: $OBJ
              regex: '(?i)^(?!(secretName|.*Name$|.*Namespace$|.*Path$)).*(secret|secretList|kubeconfig|kubeConfig|restConfig|credential|credentials|cloudCredential|authProvider|registrationCommand|registerCommand|requestBody|responseBody|rawBody|bodyBytes|payload|headers|dump).*$'
    pattern-sanitizers:
      - pattern-either:
          - pattern: redact(...)
          - pattern: redacted(...)
          - pattern: mask(...)
          - pattern: masked(...)
          - pattern: sanitize(...)
          - pattern: sanitizeLog(...)
          - pattern: sanitizeForLog(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: log.$F(..., $SINK, ...)
              - pattern: fmt.$F(..., $SINK, ...)
              - pattern: $LOGGER.$F(..., $SINK, ...)
          - metavariable-regex:
              metavariable: $F
              regex: '(?i)^(print|printf|println|debug|debugf|info|infof|warn|warnf|warning|warningf|error|errorf|fatal|fatalf|panic|panicf|trace|tracef|msg|msgf)$'
      - pattern-either:
          - pattern: zap.Any($KEY, $SINK)
          - pattern: zap.String($KEY, $SINK)
          - pattern: zap.ByteString($KEY, $SINK)
          - pattern: zap.Binary($KEY, $SINK)
          - pattern: slog.Any($KEY, $SINK)
          - pattern: slog.String($KEY, $SINK)
          - pattern: logrus.WithField($KEY, $SINK)
          - pattern: $LOGGER.WithField($KEY, $SINK)
          - pattern: $LOGGER.Str($KEY, $SINK)
          - pattern: $LOGGER.Bytes($KEY, $SINK)
          - pattern: $LOGGER.Interface($KEY, $SINK)
          - pattern: $LOGGER.Any($KEY, $SINK)

  - id: go.security.audit.dangerous-logging-sensitive-argument
    message: >-
      A value with a sensitive-looking name is being logged. This may expose
      credentials, tokens, secrets, cookies, private keys, or session data.
    severity: WARNING
    languages:
      - go
    metadata:
      category: security
      subcategory:
        - audit
      technology:
        - go
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
        - "A09:2025 - Security Logging & Alerting Failures"
      confidence: LOW
      likelihood: LOW
      impact: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/532.html
    patterns:
      - pattern-either:
          - pattern: log.$F(..., $VALUE, ...)
          - pattern: fmt.$F(..., $VALUE, ...)
          - pattern: $LOGGER.$F(..., $VALUE, ...)
      - metavariable-regex:
          metavariable: $F
          regex: '(?i)^(print|printf|println|debug|debugf|info|infof|warn|warnf|warning|warningf|error|errorf|fatal|fatalf|panic|panicf|trace|tracef|msg|msgf)$'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '(?i)^(?!(secretName|.*Name$|.*Namespace$|.*Path$)).*(pass(word)?|pwd|secret|token|credential|credentials|apiKey|api[_-]?key|privateKey|private[_-]?key|clientSecret|client[_-]?secret|accessToken|access[_-]?token|refreshToken|refresh[_-]?token|session|cookie|authorization|bearer|personalAccessToken|personal[_-]?access[_-]?token|pat|kubeconfig|kubeConfig).*$'

  - id: go.security.audit.dangerous-logging-sensitive-field-key
    message: >-
      A sensitive-looking structured log key is being logged. This may expose
      credentials, tokens, secrets, cookies, private keys, or session data.
    severity: WARNING
    languages:
      - go
    metadata:
      category: security
      subcategory:
        - audit
      technology:
        - go
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
        - "A09:2025 - Security Logging & Alerting Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/532.html
    patterns:
      - pattern-either:
          - pattern: zap.$FIELD($KEY, $VALUE)
          - pattern: slog.$FIELD($KEY, $VALUE)
          - pattern: logrus.WithField($KEY, $VALUE)
          - pattern: $LOGGER.WithField($KEY, $VALUE)
          - pattern: $LOGGER.Str($KEY, $VALUE)
          - pattern: $LOGGER.Bytes($KEY, $VALUE)
          - pattern: $LOGGER.Interface($KEY, $VALUE)
          - pattern: $LOGGER.Any($KEY, $VALUE)
          - pattern: $LOGGER.WithValues($KEY, $VALUE, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i)"[^"]*(pass(word)?|pwd|secret|token|credential|credentials|api[_-]?key|private[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token|session|cookie|authorization|bearer|personal[_-]?access[_-]?token|pat|kubeconfig|x-r-sess|x-api-key|applicationSecret|oauthCredential|serviceAccountCredential|spKey|spCert)[^"]*"'
